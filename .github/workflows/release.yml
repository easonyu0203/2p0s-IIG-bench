name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # The tag must match the version in pyproject.toml, which PyPI gets.
      - run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv build
      - run: uv publish
