[project]
name = "nashbench"
version = "0.2.0"
description = "JAX two-player zero-sum imperfect-information games for benchmarking Nash equilibrium solvers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Eason Yu", email = "breaking0203@gmail.com" }
]
keywords = [
    "jax",
    "game theory",
    "nash equilibrium",
    "imperfect information",
    "multi-agent reinforcement learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.8",
]

[project.urls]
Documentation = "https://github.com/easonyu0203/2p0s-IIG-bench#documentation"
Source = "https://github.com/easonyu0203/2p0s-IIG-bench"
Issues = "https://github.com/easonyu0203/2p0s-IIG-bench/issues"

[build-system]
requires = ["uv_build>=0.11.28,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
baselines = [
    "optax>=0.2.8",
    "scipy>=1.18.1",
    "tyro>=1.0.16",
    "wandb>=0.30.0",
]
dev = [
    "open-spiel>=2.0.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
default-groups = ["dev", "baselines"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["B", "D", "I", "UP"]
pydocstyle.convention = "google"

# Google Python style: one import per line, sorted within sections.
[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing"]

[tool.pyright]
include = ["baselines", "benchmarks", "src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
